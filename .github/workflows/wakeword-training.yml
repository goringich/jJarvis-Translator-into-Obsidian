name: Wakeword Training

on:
  workflow_dispatch:
    inputs:
      download_speech_commands:
        description: Download Google Speech Commands v0.02 before training
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  train:
    runs-on: self-hosted
    timeout-minutes: 720
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[train,wakeword]"

      - name: Download negative speech dataset
        if: ${{ inputs.download_speech_commands == 'true' }}
        run: scripts/wakeword/download-datasets.sh

      - name: Train Hello Obsidian model
        run: scripts/wakeword/train-livekit-wakeword.sh

      - name: Upload trained wakeword artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hello-obsidian-wakeword
          path: |
            training/wakeword/output/**
            training/wakeword/models/**
          if-no-files-found: error
