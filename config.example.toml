# Obsidian Voice Vocabulary config.
# Copy to ~/.config/obsidian-voice-vocab/config.toml and edit values there.

[vault]
# Main Obsidian vault path.
path = "/home/goringich/Desktop/Obsidian"

# Managed folder inside the vault.
dictionary_folder = "English"

# The application creates and maintains these 26 files.
alphabet_files = [
  "A.md", "B.md", "C.md", "D.md", "E.md", "F.md", "G.md", "H.md", "I.md",
  "J.md", "K.md", "L.md", "M.md", "N.md", "O.md", "P.md", "Q.md", "R.md",
  "S.md", "T.md", "U.md", "V.md", "W.md", "X.md", "Y.md", "Z.md",
]

[duplicates]
# false: keep existing non-empty translation/example.
# true: overwrite existing fields only when new generated/manual fields are non-empty.
overwrite_existing = false

[audio]
# Vosk and Whisper work best with 16000 Hz mono speech input.
sample_rate = 16000
channels = 1

# Empty value means PipeWire/Pulse default input device.
# On this machine the default source should be HyperX SoloCast; raw ALSA hw:0,0 rejects 16000 Hz.
# Use `obsidian-voice-vocab doctor --devices` and `obsidian-voice-vocab mic-test` to verify.
device = ""

# Smaller blocks react faster; larger blocks reduce callback overhead.
block_ms = 80

# Seconds recorded after the wake phrase is detected.
# Recording now starts immediately after wake and is trimmed/stopped when speech ends.
active_window_seconds = 6.0

# Lightweight speech detection is still used for early stop and trimming.
speech_silence_stop_seconds = 1.0
speech_min_seconds = 0.35
speech_finish_grace_seconds = 0.45
vad_mode = 2
vad_frame_ms = 30

[wake]
# Wake phrase is recognized locally by Vosk grammar mode.
phrase = "hello obsidian"
phrase_variants = ["hello obsidian", "hey obsidian", "okay obsidian"]
provider = "vosk-grammar"
require_exact_match = true
partial_confirmation_count = 2
verify_with_stt = true
verify_buffer_seconds = 1.8
verify_post_roll_seconds = 0.35
verify_whisper_model = ""
cooldown_seconds = 1.2

# Download helper installs this model by default:
# scripts/download-models.sh
model_path = "~/.local/share/obsidian-voice-vocab/models/vosk-model-small-en-us-0.15"

[stt]
# Main active-window recognizer. Heavy model is loaded lazily after wake phrase.
provider = "faster-whisper"
whisper_model = "small.en"
whisper_device = "cpu"
whisper_compute_type = "int8"
language = "en"

# If faster-whisper fails, use the same Vosk model as a lightweight fallback.
fallback_to_vosk = true

[llm]
# Supported: ollama, openai-compatible, openclaw, none.
# `openclaw` uses the OpenAI-compatible /v1/chat/completions route.
provider = "ollama"
endpoint = "http://127.0.0.1:11434"
model = "gpt-oss:20b"
timeout_seconds = 90.0
temperature = 0.2
max_tokens = 180

# If local LLM is down, use a tiny built-in dictionary when possible,
# otherwise write blank fields with Status: llm-failed.
fallback_dictionary = true

[feedback]
# Safe feedback path for this Hyprland setup. This intentionally does not enable swaync.
hyprctl_notify = true
sound = true

# Keep disabled unless you deliberately re-enable a stable notification daemon.
notify_send = false
timeout_ms = 3500
ready_sound = "/usr/share/sounds/freedesktop/stereo/service-login.oga"
wake_sound = "/usr/share/sounds/freedesktop/stereo/message-new-instant.oga"
success_sound = "/usr/share/sounds/freedesktop/stereo/complete.oga"
error_sound = "/usr/share/sounds/freedesktop/stereo/dialog-warning.oga"

[words]
# Command words ignored before selecting the first real English vocabulary word.
command_words = [
  "add",
  "append",
  "save",
  "write",
  "word",
  "term",
  "vocabulary",
  "dictionary",
  "please",
  "the",
  "a",
  "an",
  "new",
]
ignored_words = [
  "and",
  "or",
  "but",
  "oh",
  "uh",
  "um",
  "ah",
  "eh",
  "hmm",
  "in",
  "on",
  "at",
  "of",
  "to",
  "for",
  "from",
  "with",
  "by",
  "into",
  "onto",
  "over",
  "under",
  "up",
  "down",
  "out",
  "off",
]
allow_hyphenated = true
max_candidates = 1
singularize_simple_plurals = true

[runtime]
log_level = "INFO"
log_file = "~/.local/state/obsidian-voice-vocab/daemon.log"
