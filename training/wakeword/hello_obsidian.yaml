model_name: hello_obsidian
target_phrases:
  - "hello obsidian"
  - "hey obsidian"
  - "okay obsidian"
n_samples: 10000
steps: 50000
target_fp_per_hour: 0.2
data_dir: "./data"
output_dir: "training/wakeword/output"

model:
  model_type: conv_attention
  model_size: small

augmentation:
  clip_duration: 2.0
  batch_size: 16
  rounds: 1
  background_paths:
    - ./data/backgrounds
    - /home/goringich/.cache/obsidian-voice-vocab/wakeword/datasets/speech_commands_v0.02/_background_noise_
