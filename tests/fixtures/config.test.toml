[vault]
path = "/tmp/obsidian-voice-vocab-test-vault"
dictionary_folder = "English"
alphabet_files = [
  "A.md", "B.md", "C.md", "D.md", "E.md", "F.md", "G.md", "H.md", "I.md",
  "J.md", "K.md", "L.md", "M.md", "N.md", "O.md", "P.md", "Q.md", "R.md",
  "S.md", "T.md", "U.md", "V.md", "W.md", "X.md", "Y.md", "Z.md",
]

[duplicates]
overwrite_existing = false

[audio]
sample_rate = 16000
channels = 1
device = ""
block_ms = 80
active_window_seconds = 6.0

[wake]
phrase = "hello obsidian"
provider = "vosk-grammar"
model_path = "/tmp/obsidian-voice-vocab-test-vosk"

[stt]
provider = "faster-whisper"
whisper_model = "base.en"
whisper_device = "auto"
whisper_compute_type = "int8"
fallback_to_vosk = true
language = "en"

[llm]
provider = "none"
endpoint = "http://127.0.0.1:11434"
model = "qwen2.5:1.5b"
timeout_seconds = 2.0
temperature = 0.2
max_tokens = 180
fallback_dictionary = true

[words]
command_words = ["please", "add", "word"]
allow_hyphenated = true

[runtime]
log_level = "INFO"
log_file = ""

