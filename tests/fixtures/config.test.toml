[vault]
path = "/tmp/obsidian-voice-vocab-test-vault"
dictionary_folder = "English"
alphabet_files = [
  "A.md", "B.md", "C.md", "D.md", "E.md", "F.md", "G.md", "H.md", "I.md",
  "J.md", "K.md", "L.md", "M.md", "N.md", "O.md", "P.md", "Q.md", "R.md",
  "S.md", "T.md", "U.md", "V.md", "W.md", "X.md", "Y.md", "Z.md",
]

[duplicates]
overwrite_existing = false

[audio]
sample_rate = 16000
channels = 1
device = ""
block_ms = 80
active_window_seconds = 6.0
speech_silence_stop_seconds = 1.0
speech_min_seconds = 0.35
speech_finish_grace_seconds = 0.45
vad_mode = 2
vad_frame_ms = 30
speech_rms_threshold = 0.006
speech_peak_threshold = 0.020

[wake]
phrase = "hello obsidian"
phrase_variants = ["hello obsidian", "hey obsidian", "okay obsidian"]
provider = "vosk-grammar"
model_path = "/tmp/obsidian-voice-vocab-test-vosk"
require_exact_match = true
partial_confirmation_count = 2
verify_with_stt = true
verify_buffer_seconds = 2.8
verify_post_roll_seconds = 0.75
verify_whisper_model = ""
cooldown_seconds = 1.2

[stt]
provider = "faster-whisper"
whisper_model = "small.en"
whisper_device = "cpu"
whisper_compute_type = "int8"
fallback_to_vosk = true
language = "en"

[llm]
provider = "none"
endpoint = "http://127.0.0.1:11434"
model = "gpt-oss:20b"
timeout_seconds = 2.0
temperature = 0.2
max_tokens = 180
fallback_dictionary = true

[feedback]
hyprctl_notify = true
sound = false
notify_send = false
timeout_ms = 3500
min_interval_seconds = 2.0
rejection_interval_seconds = 30.0
dedupe_window_seconds = 45.0
show_wake_rejections = true

[words]
command_words = ["please", "add", "word"]
ignored_words = ["and", "oh", "in", "to"]
allow_hyphenated = true
max_candidates = 1
singularize_simple_plurals = true

[runtime]
log_level = "INFO"
log_file = ""
